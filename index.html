<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>알뜰이 — 우리 집 저녁체크</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root {
  --bg:#f2f0eb; --card:#fff; --text:#1e1e1e; --text2:#6b6b6b;
  --accent:#2d7d46; --accentL:#e8f5e9; --border:#e8e5df;
  --tag:#f7f6f2; --ok:#2e7d32; --okL:#e8f5e9;
  --warn:#b26a00; --warnL:#fff3e0;
  --danger:#c0392b; --dangerL:#fde8e5;
  --minwoo:#3b82f6; --minwooL:#dbeafe;
  --minjun:#f59e0b; --minjunL:#fef3c7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Pretendard Variable',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);line-height:1.6}
#root{max-width:480px;margin:0 auto;padding:16px 16px 100px}
header{text-align:center;margin-bottom:20px;position:relative;padding-right:90px}
header h1{font-size:24px;font-weight:700;margin-bottom:4px}
header h1 span{color:var(--accent)}
header .sub{font-size:14px;color:var(--text2)}
header .parent-link{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text2);text-decoration:none;padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--card)}header .parent-link:hover{border-color:var(--accent);color:var(--accent)}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--tag);color:var(--text2);margin-bottom:16px}
.sync.on{background:var(--okL);color:var(--ok)}
.sync.off{background:var(--warnL);color:var(--warn)}
.card{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h2{font-size:18px;font-weight:700;margin-bottom:16px}
.dinner-menu{font-size:16px;line-height:1.7;padding:12px;background:#faf9f6;border-radius:10px;margin-bottom:12px}
.dinner-menu b{color:var(--text)}
.dinner-meta{display:flex;gap:12px;font-size:13px;color:var(--text2);flex-wrap:wrap;margin-bottom:16px}
.dinner-photo{width:100%;border-radius:10px;margin-top:12px;display:none}
.checkin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkin-btn{padding:16px 12px;border-radius:12px;border:2px solid var(--border);background:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all .15s}
.checkin-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.checkin-btn small{font-size:11px;font-weight:500;opacity:.8}
.checkin-btn.minwoo{border-color:var(--minwoo);color:var(--minwoo);background:var(--minwooL)}
.checkin-btn.minwoo.on{background:var(--minwoo);border-color:var(--minwoo);color:#fff}
.checkin-btn.minjun{border-color:var(--minjun);color:var(--minjun);background:var(--minjunL)}
.checkin-btn.minjun.on{background:var(--minjun);border-color:var(--minjun);color:#fff}
.status-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;display:none}
.status-btn{padding:8px 6px;border-radius:8px;border:1px solid var(--border);background:#fff;font:inherit;font-size:11px;font-weight:600;cursor:pointer}
.status-btn.home{border-color:var(--ok);color:var(--ok)}
.status-btn.out{border-color:var(--minjun);color:var(--minjun)}
.status-btn.skip{border-color:var(--danger);color:var(--danger);background:var(--dangerL)}
.checkin-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .15s}
.checkin-opt:has(input:checked){border-color:var(--accent)!important;background:var(--accentL)!important;box-shadow:0 0 0 3px var(--accentL);}
.checkin-opt:active{transform:scale(0.98);}
.checkin-opt input[type="checkbox"]{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}
.checkin-opt input[type="time"]{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:14px;background:#fff;color:var(--text);width:auto}
.checkin-opt input[type="time"]:focus{outline:none;border-color:var(--accent)}
.checkin-opt span{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap}
.checkin-status{margin-top:10px;padding:10px;border-radius:8px;text-align:center;font-weight:700;font-size:13px;display:none}
.checkin-status.minwoo{background:#f0fdf4;color:var(--ok)}
.checkin-status.minjun{background:#fef3c7;color:var(--warn)}
.photo-upload{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.photo-upload input[type="file"]{display:none}
.photo-upload label{flex:1;padding:12px;border:2px dashed var(--border);border-radius:10px;text-align:center;cursor:pointer;color:var(--text2);font-size:14px;transition:all .15s}
.photo-upload label:hover{border-color:var(--accent);color:var(--accent);background:var(--accentL)}
.photo-preview{width:100%;border-radius:10px;margin-top:12px;display:none}
.dinner-photo{width:100%;border-radius:10px;margin-top:12px;display:none;cursor:pointer}
.time-edit-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
.time-edit-modal.show{display:flex}
.time-edit-modal-content{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:360px}
.time-edit-modal h3{margin-bottom:16px;font-size:18px;text-align:center}
.time-edit-modal .time-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.time-edit-modal .time-btn{padding:12px;border:2px solid var(--border);border-radius:10px;background:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.time-edit-modal .time-btn:hover{border-color:var(--accent);background:var(--accentL)}
.time-edit-modal .time-btn.selected{border-color:var(--accent);background:var(--accent);color:#fff}
.time-edit-modal .time-custom{display:flex;gap:8px;margin-bottom:16px}
.time-edit-modal .time-custom input{flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:16px}
.time-edit-modal .time-btns{display:flex;gap:8px}
.time-edit-modal .time-btns button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--border);background:#fff;font:inherit;font-size:14px;font-weight:600;color:var(--text);cursor:pointer}
.time-edit-modal .time-btns button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.photo-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:1001;align-items:center;justify-content:center;padding:20px}
.photo-modal.show{display:flex}
.photo-modal img{max-width:90%;max-height:90%;border-radius:8px}
.photo-modal .close-btn{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;border:none;font-size:24px;cursor:pointer}
.memo-row{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.memo-row select,.memo-row input{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:13px}
.memo-row button{width:100%;padding:10px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.memo-list{margin-top:12px}
.memo-item{background:#faf9f6;border-radius:10px;padding:12px;margin-bottom:8px;border-left:3px solid var(--accent);animation:slideIn .2s ease}
.memo-item.minwoo{border-left-color:var(--minwoo)}
.memo-item.minjun{border-left-color:var(--minjun)}
.memo-item.done{opacity:.5;background:#f0f0f0}
.memo-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.memo-name{font-weight:700;font-size:13px}
.memo-name.minwoo{color:var(--minwoo)}
.memo-name.minjun{color:var(--minjun)}
.memo-time{font-size:11px;color:var(--text2);margin-left:auto}
.memo-text{font-size:13.5px;line-height:1.6}
.memo-item.done .memo-text{text-decoration:line-through;color:var(--text2)}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
footer{text-align:center;padding-top:24px;border-top:1px solid var(--border);font-size:11px;color:var(--text2);line-height:1.8}
</style>
</head>
<body>
<div id="root">
  <header>
    <h1>🏠 <span>알뜰이</span> 우리 집</h1>
    <p class="sub">오늘 저녁 뭐 먹지? · 준비물 말해줘</p>
    <a href="budget.html" style="position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text2);text-decoration:none;padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--card)">🔒 부모 모드</a>
  </header>
  <div id="syncBadge" class="sync off">⚪ 오프라인 · 로컬 저장 중</div>

  <section class="card" id="todayDinner">
    <h2>🍽️ 오늘 저녁</h2>
    <div class="dinner-menu" id="dinnerMenu">
      <div style="color:var(--text2);text-align:center;padding:20px">아직 저녁 메뉴가 정해지지 않았어요<br><small>부모님이 입력해주시면 여기에 보여요</small></div>
    </div>
    <div id="dinnerMeta" style="display:none" class="dinner-meta">
      <span id="dinnerTime" style="cursor:pointer" onclick="editDinnerTime()"></span>
      <span id="dinnerPlace"></span>
    </div>
    <div style="margin-top:12px">
      <div class="photo-upload" style="display:flex;gap:8px;flex-wrap:wrap">
        <input type="file" id="dinnerPhotoInput" accept="image/*" onchange="uploadDinnerPhoto(this)" style="display:none">
        <label for="dinnerPhotoInput" style="flex:1;padding:12px;border:2px dashed var(--border);border-radius:10px;text-align:center;cursor:pointer;color:var(--text2);font-size:14px;transition:all .15s">📷 저녁 사진 올리기</label>
      </div>
    </div>
    <img id="dinnerPhoto" class="dinner-photo" alt="저녁 사진" onclick="openPhotoModal(this.src)">

  <section class="card">
    <h2>👨‍👦 오늘 저녁 어떻게 먹니?</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div style="border:2px solid var(--minwoo);border-radius:16px;padding:16px;background:linear-gradient(135deg,var(--minwooL) 0%,#fff 100%);width:180px">
        <div style="font-weight:800;color:var(--minwoo);font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:6px">👦 민우</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label class="checkin-opt" data-child="minwoo" data-value="집에서 먹음">
            <input type="checkbox" name="cin_minwoo_home" value="집에서 먹음" onchange="setCheckin('minwoo','집에서 먹음')" style="width:20px;height:20px;accent-color:var(--minwoo);flex-shrink:0">
            <span style="font-size:15px;font-weight:600;color:var(--text);white-space:nowrap">🏠 집</span>
          </label>
          <div id="minwooTimeWrapper" style="display:none;margin-left:28px;margin-top:-4px;margin-bottom:4px;display:flex;gap:6px;align-items:center">
            <input type="time" name="cin_minwoo_time" step="1800" min="16:00" max="24:00" value="" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:14px;background:#fff;color:var(--text);width:auto" onchange="setCheckinTime('minwoo',this.value)">
            <button type="button" onclick="setCheckinTime('minwoo',document.querySelector('input[name=\"cin_minwoo_time\"]').value)" style="padding:4px 8px;font-size:12px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer">저장</button>
          </div>
          <label class="checkin-opt" data-child="minwoo" data-value="외식">
            <input type="checkbox" name="cin_minwoo_out" value="외식" onchange="setCheckin('minwoo','외식')">
            <span style="font-size:15px;font-weight:600;color:var(--text);white-space:nowrap">🍽️ 외식</span>
          </label>
          <label class="checkin-opt" data-child="minwoo" data-value="안 먹음">
            <input type="checkbox" name="cin_minwoo_skip" value="안 먹음" onchange="setCheckin('minwoo','안 먹음')">
            <span style="font-size:15px;font-weight:600;color:var(--text);white-space:nowrap">❌ 안먹음</span>
          </label>
        </div>
        <div id="cinMinwooStatus" class="checkin-status minwoo"></div>
      </div>

      <div style="border:2px solid var(--minjun);border-radius:16px;padding:16px;background:linear-gradient(135deg,var(--minjunL) 0%,#fff 100%);width:180px">
        <div style="font-weight:800;color:var(--minjun);font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:6px">👦 민준</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label class="checkin-opt" data-child="minjun" data-value="집에서 먹음">
            <input type="checkbox" name="cin_minjun_home" value="집에서 먹음" onchange="setCheckin('minjun','집에서 먹음')" style="width:20px;height:20px;accent-color:var(--minwoo);flex-shrink:0">
            <span style="font-size:15px;font-weight:600;color:var(--text);white-space:nowrap">🏠 집</span>
          </label>
          <div id="minjunTimeWrapper" style="display:none;margin-left:28px;margin-top:-4px;margin-bottom:4px;display:flex;gap:6px;align-items:center">
            <input type="time" name="cin_minjun_time" step="1800" min="16:00" max="24:00" value="" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:14px;background:#fff;color:var(--text);width:auto" onchange="setCheckinTime('minjun',this.value)">
            <button type="button" onclick="setCheckinTime('minjun',document.querySelector('input[name=\"cin_minjun_time\"]').value)" style="padding:4px 8px;font-size:12px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer">저장</button>
          </div>
          <label class="checkin-opt" data-child="minjun" data-value="외식">
            <input type="checkbox" name="cin_minjun_out" value="외식" onchange="setCheckin('minjun','외식')">
            <span style="font-size:15px;font-weight:600;color:var(--text);white-space:nowrap">🍽️ 외식</span>
          </label>
          <label class="checkin-opt" data-child="minjun" data-value="안 먹음">
            <input type="checkbox" name="cin_minjun_skip" value="안 먹음" onchange="setCheckin('minjun','안 먹음')">
            <span style="font-size:15px;font-weight:600;color:var(--text);white-space:nowrap">❌ 안먹음</span>
          </label>
        </div>
        <div id="cinMinjunStatus" class="checkin-status minjun"></div>
    </div>
    <div id="memoList" class="memo-list"></div>
  </section>

  <footer>
    🏠 <strong>알뜰이 가족 공유</strong> · 데이터는 자동 동기화됩니다.
  </footer>
</div>

<script>
const KEY='alttul-family-2026';
const SYNC='https://macbook-pro-54.tail1e8f41.ts.net/api/state';
const LIST='family-2026';
const $sync=document.getElementById('syncBadge');
let data={dinner:{today:{date:'',menu:'',time:'',timeMinjun:'',place:'',photo:''},checkin:{minwoo:'',minjun:''},checkinTime:{minwoo:'',minjun:''},checkinPhoto:{minwoo:'',minjun:''},memos:[],history:[]}};
let curChild=null;

function today(){return new Date().toISOString().slice(0,10)}
function day(d){return ['일','월','화','수','목','금','토'][new Date(d).getDay()]}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v){data=v;data.dinner=data.dinner||{today:{date:'',menu:'',time:'',place:'',photo:''},checkin:{minwoo:'',minjun:''},checkinTime:{minwoo:'',minjun:''},checkinPhoto:{minwoo:'',minjun:''},memos:[],history:[]};data.dinner.today=data.dinner.today||{date:'',menu:'',time:'',place:'',photo:''};data.dinner.checkin=data.dinner.checkin||{minwoo:'',minjun:''};data.dinner.checkinTime=data.dinner.checkinTime||{minwoo:'',minjun:''};data.dinner.checkinPhoto=data.dinner.checkinPhoto||{minwoo:'',minjun:''};data.dinner.memos=data.dinner.memos||[];data.dinner.history=data.dinner.history||[]}return data}catch(e){return data}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}push()}
async function push(){
  try{
    await fetch(SYNC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({list:LIST,items:data})});
    $sync.textContent='🟢 온라인 · 동기화됨';$sync.className='sync on';
  }catch(e){
    $sync.textContent='⚪ 오프라인 · 로컬 저장 중';$sync.className='sync off';
  }
}
async function pull(){
  try{
    const r=await fetch(SYNC+'?list='+LIST+'&_='+Date.now(),{cache:'no-store'});
    if(r.ok){
      const j=await r.json();
      if(j.items){
        data=merge(data,j.items);
        localStorage.setItem(KEY,JSON.stringify(data));
        render();
      }
      $sync.textContent='🟢 온라인 · 동기화됨';$sync.className='sync on';
    }
  }catch(e){
    $sync.textContent='⚪ 오프라인 · 로컬 저장 중';$sync.className='sync off';
  }
}
function merge(local,remote){
  const m=JSON.parse(JSON.stringify(local));
  if(remote.dinner){
    const ld=m.dinner, rd=remote.dinner;
    // checkinTime이 비어있으면 today.time/timeMinjun으로 채움
    const checkinTime = rd.checkinTime || ld.checkinTime || {minwoo:'',minjun:''};
    if(!checkinTime.minwoo && (rd.today?.time || ld.today?.time)) checkinTime.minwoo = rd.today?.time || ld.today?.time || '';
    if(!checkinTime.minjun && (rd.today?.timeMinjun || ld.today?.timeMinjun)) checkinTime.minjun = rd.today?.timeMinjun || ld.today?.timeMinjun || '';
    
    m.dinner={
      today:ld.today||rd.today||{date:'',menu:'',time:'',timeMinjun:'',place:'',photo:''},
      checkin:rd.checkin||ld.checkin||{minwoo:'',minjun:''},
      checkinTime: checkinTime,
      checkinPhoto:rd.checkinPhoto||ld.checkinPhoto||{minwoo:'',minjun:''},
      memos:[...(ld.memos||[]),...(rd.memos||[])].filter((x,i,a)=>a.findIndex(y=>y.t===x.t)===i),
      history:[...(ld.history||[]),...(rd.history||[])].filter((x,i,a)=>a.findIndex(y=>y.date===x.date&&y.menu===x.menu)===i)
    };
  }
  return m;
}
setInterval(pull,5000);window.addEventListener('focus',pull);data=load();pull().then(render);

function render(){
  const d=data.dinner, td=today();
  if(d.today.date!==td){
    const savedCheckinTime = {...d.checkinTime};
    const savedCheckinPhoto = {...d.checkinPhoto};
    d.today={date:td,menu:'',time:'',place:'',photo:''};
    d.checkin={minwoo:'',minjun:''};
    d.checkinTime=savedCheckinTime;
    d.checkinPhoto=savedCheckinPhoto;
    save();
  }
  document.getElementById('dinnerMenu').innerHTML=d.today.menu?'<b>'+d.today.menu+'</b>':'아직 저녁 메뉴가 정해지지 않았어요<br><small>부모님이 입력해주시면 여기에 보여요</small>';
  const $m=document.getElementById('dinnerMeta'),$t=document.getElementById('dinnerTime'),$p=document.getElementById('dinnerPlace'),$ph=document.getElementById('dinnerPhoto');
  if(d.today.menu){
    $m.style.display='flex';
    const times = [];
    const timeMinwoo = (d.checkinTime?.minwoo || d.today?.time || '').trim() ? (d.checkinTime?.minwoo || d.today?.time || '') : '';
    const timeMinjun = (d.checkinTime?.minjun || d.today?.timeMinjun || '').trim() ? (d.checkinTime?.minjun || d.today?.timeMinjun || '') : '';
    if(timeMinwoo) times.push('👦 민우 '+timeMinwoo);
    if(timeMinjun) times.push('👦 민준 '+timeMinjun);
    $t.textContent=times.length?times.join(' / '):'⏰ 시간 미정';
    $p.textContent=d.today.place?'📍 '+d.today.place:'📍 장소 미정';
    if(d.today.photo){
      $ph.src=d.today.photo;
      $ph.style.display='block';
    }else{$ph.style.display='none'}
    $m.style.display='flex';
  }else{$m.style.display='none';$ph.style.display='none'}
  ['minwoo','minjun'].forEach(k=>{
    const val = d.checkin[k] || '';
    const isHome = val === '집에서 먹음';
    ['home','out','skip'].forEach(opt=>{
      const el = document.querySelector(`input[name="cin_${k}_${opt}"]`);
      if (el) el.checked = (val === el.value);
    });
    const timeEl = document.querySelector(`input[name="cin_${k}_time"]`);
    if(timeEl){
      timeEl.style.display = isHome ? 'inline-block' : 'none';
      if(isHome && d.checkinTime[k]) timeEl.value = d.checkinTime[k];
    }
    const $photoUpload = document.getElementById(k+'PhotoUpload');
    if($photoUpload) $photoUpload.style.display = isHome ? 'flex' : 'none';
    const $s = document.getElementById('cin'+k[0].toUpperCase()+k.slice(1)+'Status');
    if ($s) {
      const timeDisplay = (d.checkinTime?.[k] || d.today?.time || (k === 'minjun' ? d.today?.timeMinjun : '') || '').trim();
      if (val) { $s.textContent = val + (timeDisplay ? ' · '+timeDisplay : ''); $s.style.display = 'block'; }
      else { $s.style.display = 'none'; }
    }
    if(isHome){
      document.getElementById(k+'PhotoUpload').style.display = 'flex';
    }else{
      document.getElementById(k+'PhotoUpload').style.display = 'none';
    }
  });
  renderMemos();
}
function setCheckin(child, value) {
  const isHome = value === '집에서 먹음';
  const timeWrapper = document.getElementById(child+'TimeWrapper');
  const photoUpload = document.getElementById(child+'PhotoUpload');
  if(timeWrapper) timeWrapper.style.display = isHome ? 'block' : 'none';
  if(photoUpload) photoUpload.style.display = isHome ? 'flex' : 'none';
  data.dinner.checkin[child] = value;
  if(isHome && !data.dinner.checkinTime[child]){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(Math.ceil(now.getMinutes()/30)*30%60).padStart(2,'0');
    data.dinner.checkinTime[child] = `${String(now.getHours()).padStart(2,'0')}:${String(Math.ceil(now.getMinutes()/30)*30%60).padStart(2,'0')}`;
  }
  save(); render();
}

function setCheckinTime(child, time) {

  save(); render();
}

function uploadPhoto(child, input) {
  const file = input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')) return alert('이미지 파일만 가능합니다');
  if(file.size > 5*1024*1024) return alert('5MB 이하만 가능합니다');
  const reader = new FileReader();
  reader.onload = e => {
    data.dinner.checkinPhoto[child] = e.target.result;
    data.dinner.today.photo = e.target.result;
    save(); render();
  };
  reader.readAsDataURL(file);
}

function openTimeEditModal() {
  if(!data.dinner.today.menu) return;
  document.getElementById('timeEditModal').classList.add('show');
  renderTimeOptions();
}
function closeTimeEditModal() {
  document.getElementById('timeEditModal').classList.remove('show');
}
function renderTimeOptions() {
  const container = document.getElementById('timeOptions');
  let html = '';
  for(let h = 16; h <= 24; h++) {
    for(let m = 0; m < 60; m += 30) {
      if(h === 24 && m > 0) continue;
      const hh = String(h).padStart(2,'0');
      const mm = String(m).padStart(2,'0');
      const timeStr = `${hh}:${mm}`;
      const isCurrent = data.dinner.today.time === timeStr;
      html += `<button class="time-btn${isCurrent ? ' selected' : ''}" onclick="selectTime('${timeStr}')">${timeStr}</button>`;
    }
  }
  document.getElementById('timeOptions').innerHTML = html;
  document.getElementById('customTime').value = data.dinner.today.time || '';
}
function selectTime(time) {
  document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
  event.target.classList.add('selected');
  document.getElementById('customTime').value = time;
}
function saveTimeFromModal() {
  const time = document.getElementById('customTime').value;
  if(!time) return alert('시간을 선택하세요');
  data.dinner.today.time = time;
  closeTimeEditModal();
  save(); render();
}
function closeTimeEditModal() {
  document.getElementById('timeEditModal').classList.remove('show');
}

function openPhotoModal(src) {
  if(!src) return;
  document.getElementById('photoModalImg').src = src;
  document.getElementById('photoModal').classList.add('show');
}
function closePhotoModal() {
  document.getElementById('photoModal').classList.remove('show');
  document.getElementById('photoModalImg').src = '';
}

  const file = input.files[0];

  if(file.size > 5*1024*1024) return alert('5MB 이하만 가능합니다');
  const reader = new FileReader();
  reader.onload = e => {
    data.dinner.today.photo = e.target.result;
    save(); render();
  };
  reader.readAsDataURL(file);
}

function renderMemos(){const $l=document.getElementById('memoList');$l.innerHTML=data.dinner.memos.map((m,i)=>`<div class="memo-item ${m.child} ${m.done?'done':''}" onclick="toggleMemo(${i})"><div class="memo-top"><span class="memo-name ${m.child}">${m.child==='minwoo'?'👦 민우':'👦 민준'}</span><span class="memo-time">${m.time}</span></div><div class="memo-text">${m.text}</div></div>`).join('')||'<div style="text-align:center;color:var(--text2);padding:16px">아직 요청사항이 없어요. 위 버튼으로 알려주세요!</div>';}
function addMemo(){const c=document.getElementById('memoChild').value,t=document.getElementById('memoText').value.trim();if(!t)return alert('내용을 입력하세요');data.dinner.memos.unshift({child:c,text:t,done:false,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),t:Date.now()});save();renderMemos();document.getElementById('memoText').value='';}
function toggleMemo(i){data.dinner.memos[i].done=!data.dinner.memos[i].done;save();renderMemos();}
render();
</script>
