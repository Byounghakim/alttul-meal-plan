<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>알뜰이 — 우리 집 저녁체크</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root {
  --bg:#f2f0eb; --card:#fff; --text:#1e1e1e; --text2:#6b6b6b;
  --accent:#2d7d46; --accentL:#e8f5e9; --border:#e8e5df;
  --tag:#f7f6f2; --ok:#2e7d32; --okL:#e8f5e9;
  --warn:#b26a00; --warnL:#fff3e0;
  --danger:#c0392b; --dangerL:#fde8e5;
  --minwoo:#3b82f6; --minwooL:#dbeafe;
  --minjun:#f59e0b; --minjunL:#fef3c7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Pretendard Variable',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);line-height:1.6}
#root{max-width:480px;margin:0 auto;padding:16px 16px 100px}
header{text-align:center;margin-bottom:20px;position:relative}
header h1{font-size:24px;font-weight:700;margin-bottom:4px}
header h1 span{color:var(--accent)}
header .sub{font-size:14px;color:var(--text2)}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--tag);color:var(--text2);margin-bottom:16px}
.sync.on{background:var(--okL);color:var(--ok)}
.sync.off{background:var(--warnL);color:var(--warn)}
.card{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h2{font-size:18px;font-weight:700;margin-bottom:16px}
.dinner-menu{font-size:16px;line-height:1.7;padding:12px;background:#faf9f6;border-radius:10px;margin-bottom:12px}
.dinner-menu b{color:var(--text)}
.dinner-meta{display:flex;gap:12px;font-size:13px;color:var(--text2);flex-wrap:wrap;margin-bottom:16px}
.checkin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkin-btn{padding:16px 12px;border-radius:12px;border:2px solid var(--border);background:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all .15s}
.checkin-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.checkin-btn small{font-size:11px;font-weight:500;opacity:.8}
.checkin-btn.minwoo{border-color:var(--minwoo);color:var(--minwoo);background:var(--minwooL)}
.checkin-btn.minwoo.on{background:var(--minwoo);border-color:var(--minwoo);color:#fff}
.checkin-btn.minjun{border-color:var(--minjun);color:var(--minjun);background:var(--minjunL)}
.checkin-btn.minjun.on{background:var(--minjun);border-color:var(--minjun);color:#fff}
.status-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;display:none}
.status-btn{padding:8px 6px;border-radius:8px;border:1px solid var(--border);background:#fff;font:inherit;font-size:11px;font-weight:600;cursor:pointer}
.status-btn.home{border-color:var(--ok);color:var(--ok)}
.status-btn.out{border-color:var(--minjun);color:var(--minjun)}
.status-btn.skip{border-color:var(--danger);color:var(--danger);background:var(--dangerL)}
.memo-row{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.memo-row select,.memo-row input{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:13px}
.memo-row button{width:100%;padding:10px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.memo-list{margin-top:12px}
.memo-item{background:#faf9f6;border-radius:10px;padding:12px;margin-bottom:8px;border-left:3px solid var(--accent);animation:slideIn .2s ease}
.memo-item.minwoo{border-left-color:var(--minwoo)}
.memo-item.minjun{border-left-color:var(--minjun)}
.memo-item.done{opacity:.5;background:#f0f0f0}
.memo-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.memo-name{font-weight:700;font-size:13px}
.memo-name.minwoo{color:var(--minwoo)}
.memo-name.minjun{color:var(--minjun)}
.memo-time{font-size:11px;color:var(--text2);margin-left:auto}
.memo-text{font-size:13.5px;line-height:1.6}
.memo-item.done .memo-text{text-decoration:line-through;color:var(--text2)}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
footer{text-align:center;padding-top:24px;border-top:1px solid var(--border);font-size:11px;color:var(--text2);line-height:1.8}
</style>
</head>
<body>
<div id="root">
  <header>
    <h1>🏠 <span>알뜰이</span> 우리 집</h1>
    <p class="sub">오늘 저녁 뭐 먹지? · 준비물 말해줘</p>
  </header>
  <div id="syncBadge" class="sync off">⚪ 오프라인 · 로컬 저장 중</div>

  <section class="card" id="todayDinner">
    <h2>🍽️ 오늘 저녁</h2>
    <div class="dinner-menu" id="dinnerMenu">
      <div style="color:var(--text2);text-align:center;padding:20px">아직 저녁 메뉴가 정해지지 않았어요<br><small>부모님이 입력해주시면 여기에 보여요</small></div>
    </div>
    <div id="dinnerMeta" style="display:none" class="dinner-meta">
      <span id="dinnerTime"></span>
      <span id="dinnerPlace"></span>
    </div>
  </section>

  <section class="card">
    <h2>👨‍👦 오늘 저녁 어떻게 먹니?</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div style="border:2px solid var(--minwoo);border-radius:16px;padding:20px;background:linear-gradient(135deg,var(--minwooL) 0%,#fff 100%)">
        <div style="font-weight:800;color:var(--minwoo);font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:8px">👦 민우</div>
        <div style="display:flex;flex-direction:column;gap:12px">
          <label style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .15s">
            <input type="checkbox" name="cin_minwoo_home" value="집에서 먹음" onchange="setCheckin('minwoo','집에서 먹음')" style="width:22px;height:22px;accent-color:var(--minwoo);flex-shrink:0">
            <span style="font-size:16px;font-weight:600;color:var(--text)">🏠 집에서 먹음</span>
          </label>
          <label style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .15s">
            <input type="checkbox" name="cin_minwoo_out" value="외식" onchange="setCheckin('minwoo','외식')" style="width:22px;height:22px;accent-color:var(--minjun);flex-shrink:0">
            <span style="font-size:16px;font-weight:600;color:var(--text)">🍽️ 외식</span>
          </label>
          <label style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .15s">
            <input type="checkbox" name="cin_minwoo_skip" value="안 먹음" onchange="setCheckin('minwoo','안 먹음')" style="width:22px;height:22px;accent-color:var(--danger);flex-shrink:0">
            <span style="font-size:16px;font-weight:600;color:var(--text)">❌ 안 먹음</span>
          </label>
        </div>
        <div id="cinMinwooStatus" style="margin-top:12px;padding:10px;background:#f0fdf4;border-radius:8px;text-align:center;font-weight:600;color:var(--ok);font-size:14px;display:none"></div>
      </div>

      <div style="border:2px solid var(--minjun);border-radius:16px;padding:20px;background:linear-gradient(135deg,var(--minjunL) 0%,#fff 100%)">
        <div style="font-weight:800;color:var(--minjun);font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:8px">👦 민준</div>
        <div style="display:flex;flex-direction:column;gap:12px">
          <label style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .15s">
            <input type="checkbox" name="cin_minjun_home" value="집에서 먹음" onchange="setCheckin('minjun','집에서 먹음')" style="width:22px;height:22px;accent-color:var(--minwoo);flex-shrink:0">
            <span style="font-size:16px;font-weight:600;color:var(--text)">🏠 집에서 먹음</span>
          </label>
          <label style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .15s">
            <input type="checkbox" name="cin_minjun_out" value="외식" onchange="setCheckin('minjun','외식')" style="width:22px;height:22px;accent-color:var(--minjun);flex-shrink:0">
            <span style="font-size:16px;font-weight:600;color:var(--text)">🍽️ 외식</span>
          </label>
          <label style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .15s">
            <input type="checkbox" name="cin_minjun_skip" value="안 먹음" onchange="setCheckin('minjun','안 먹음')" style="width:22px;height:22px;accent-color:var(--danger);flex-shrink:0">
            <span style="font-size:16px;font-weight:600;color:var(--text)">❌ 안 먹음</span>
          </label>
        </div>
        <div id="cinMinjunStatus" style="margin-top:12px;padding:10px;background:#fef3c7;border-radius:8px;text-align:center;font-weight:600;color:var(--warn);font-size:14px;display:none"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>📝 준비물·부탁할 거</h2>
    <div class="memo-row">
      <select id="memoChild"><option value="minwoo">👦 민우</option><option value="minjun">👦 민준</option></select>
      <input type="text" id="memoText" placeholder="내용 (예: 내일 체육복, 용돈 5천원)">
      <button onclick="addMemo()">등록하기</button>
    </div>
    <div id="memoList" class="memo-list"></div>
  </section>

  <footer>
    🏠 <strong>알뜰이 가족 공유</strong> · 데이터는 자동 동기화됩니다.
  </footer>
</div>

<script>
const KEY='alttul-family-2026';
const SYNC='https://macbook-pro-54.tail1e8f41.ts.net/api/state';
const LIST='family-2026';
const $sync=document.getElementById('syncBadge');
let data={dinner:{today:{date:'',menu:'',time:'',place:''},checkin:{minwoo:'',minjun:''},memos:[],history:[]}};
let curChild=null;

function today(){return new Date().toISOString().slice(0,10)}
function day(d){return ['일','월','화','수','목','금','토'][new Date(d).getDay()]}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v){data=v;data.dinner=data.dinner||{today:{date:'',menu:'',time:'',place:''},checkin:{minwoo:'',minjun:''},memos:[],history:[]};data.dinner.today=data.dinner.today||{date:'',menu:'',time:'',place:''};data.dinner.checkin=data.dinner.checkin||{minwoo:'',minjun:''};data.dinner.memos=data.dinner.memos||[];data.dinner.history=data.dinner.history||[]}return data}catch(e){return data}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}push()}
async function push(){
  try{
    await fetch(SYNC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({list:LIST,items:data})});
    $sync.textContent='🟢 온라인 · 동기화됨';$sync.className='sync on';
  }catch(e){
    $sync.textContent='⚪ 오프라인 · 로컬 저장 중';$sync.className='sync off';
  }
}
async function pull(){
  try{
    const r=await fetch(SYNC+'?list='+LIST+'&_='+Date.now(),{cache:'no-store'});
    if(r.ok){
      const j=await r.json();
      if(j.items){
        data=merge(data,j.items);
        localStorage.setItem(KEY,JSON.stringify(data));
        render();
      }
      $sync.textContent='🟢 온라인 · 동기화됨';$sync.className='sync on';
    }
  }catch(e){
    $sync.textContent='⚪ 오프라인 · 로컬 저장 중';$sync.className='sync off';
  }
}
function merge(local,remote){
  const m=JSON.parse(JSON.stringify(local));
  if(remote.dinner){
    const ld=m.dinner, rd=remote.dinner;
    m.dinner={
      today:ld.today||rd.today||{date:'',menu:'',time:'',place:''},
      checkin:rd.checkin||ld.checkin||{minwoo:'',minjun:''},
      memos:[...(ld.memos||[]),...(rd.memos||[])].filter((x,i,a)=>a.findIndex(y=>y.t===x.t)===i),
      history:[...(ld.history||[]),...(rd.history||[])].filter((x,i,a)=>a.findIndex(y=>y.date===x.date&&y.menu===x.menu)===i)
    };
  }
  return m;
}
setInterval(pull,5000);window.addEventListener('focus',pull);data=load();pull();render();

function render(){
  const d=data.dinner, td=today();
  if(d.today.date!==td){d.today={date:td,menu:'',time:'',place:''};d.checkin={minwoo:'',minjun:''};save()}
  document.getElementById('dinnerMenu').innerHTML=d.today.menu?'<b>'+d.today.menu+'</b>':'아직 저녁 메뉴가 정해지지 않았어요<br><small>부모님이 입력해주시면 여기에 보여요</small>';
  const $m=document.getElementById('dinnerMeta'),$t=document.getElementById('dinnerTime'),$p=document.getElementById('dinnerPlace');
  if(d.today.menu){$m.style.display='flex';$t.textContent=d.today.time?'⏰ '+d.today.time+' 예정':'⏰ 시간 미정';$p.textContent=d.today.place?'📍 '+d.today.place:'📍 장소 미정'}else{$m.style.display='none'}
  ['minwoo','minjun'].forEach(k=>{
    const val = d.checkin[k] || '';
    ['home','out','skip'].forEach(opt=>{
      const el = document.querySelector(`input[name="cin_${k}_${opt}"]`);
      if (el) el.checked = (val === el.value);
    });
    const $s = document.getElementById('cin'+k[0].toUpperCase()+k.slice(1)+'Status');
    if ($s) {
      if (val) { $s.textContent = val; $s.style.display = 'block'; }
      else { $s.style.display = 'none'; }
    }
  });
  renderMemos();
}
function setCheckin(child, value) {
  // Uncheck other checkboxes for this child
  ['home','out','skip'].forEach(k => {
    const el = document.querySelector(`input[name="cin_${child}_${k}"]`);
    if (el && el.value !== value) el.checked = false;
  });
  data.dinner.checkin[child] = value;
  save(); render();
}
function renderMemos(){const $l=document.getElementById('memoList');$l.innerHTML=data.dinner.memos.map((m,i)=>`<div class="memo-item ${m.child} ${m.done?'done':''}" onclick="toggleMemo(${i})"><div class="memo-top"><span class="memo-name ${m.child}">${m.child==='minwoo'?'👦 민우':'👦 민준'}</span><span class="memo-time">${m.time}</span></div><div class="memo-text">${m.text}</div></div>`).join('')||'<div style="text-align:center;color:var(--text2);padding:16px">아직 요청사항이 없어요. 위 버튼으로 알려주세요!</div>';}
function addMemo(){const c=document.getElementById('memoChild').value,t=document.getElementById('memoText').value.trim();if(!t)return alert('내용을 입력하세요');data.dinner.memos.unshift({child:c,text:t,done:false,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),t:Date.now()});save();renderMemos();document.getElementById('memoText').value='';}
function toggleMemo(i){data.dinner.memos[i].done=!data.dinner.memos[i].done;save();renderMemos();}
render();
</script>
</body>
</html>
